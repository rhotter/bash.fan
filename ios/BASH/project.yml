name: BASH
options:
  bundleIdPrefix: fan.bash
  deploymentTarget:
    iOS: "17.0"
packages:
  HaishinKit:
    url: https://github.com/HaishinKit/HaishinKit.swift.git
    exactVersion: 2.2.5
targets:
  BASH:
    type: application
    platform: iOS
    sources:
      - Sources
      - path: ../BASHCapture/Sources
        excludes: [Assets.xcassets]
    dependencies:
      - package: HaishinKit
        product: HaishinKit
      - package: HaishinKit
        product: RTMPHaishinKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fan.bash.league
        DEVELOPMENT_TEAM: 8GJXSBZAF8
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) BASH_LEAGUE"
        BASH_SERVER_URL: https://bash-git-video-raffi-hotters-projects.vercel.app
        INFOPLIST_KEY_NSCameraUsageDescription: Record rink video with BASH Capture.
        INFOPLIST_KEY_NSMicrophoneUsageDescription: Record rink audio with your video.
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "19"
        INFOPLIST_KEY_CFBundleDisplayName: BASH
    info:
      path: Info.plist
      properties:
        BASHServerURL: $(BASH_SERVER_URL)
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        UILaunchScreen: {}
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
  BASHUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [UITests]
    dependencies:
      - target: BASH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
  BASHTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BASH
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
