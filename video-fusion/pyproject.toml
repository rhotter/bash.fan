[project]
name = "bash-video-fusion"
version = "0.1.0"
description = "Fixed-rig two-camera panorama calibration, synchronization and streaming prototype"
requires-python = ">=3.11"
dependencies = ["numpy>=2,<3", "opencv-python-headless>=4.10,<5", "scipy>=1.14,<2", "av>=14,<17"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
bash-fusion = "bash_fusion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["bash_fusion"]
