name: BASH TestFlight

on:
  push:
    # The native app currently ships from video. Other refs require an explicit run.
    branches: [video]
    paths:
      - 'ios/BASH/**'
      - '.github/workflows/bash-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    working-directory: ios/BASH

env:
  FASTLANE_SKIP_UPDATE_CHECK: 'true'
  FASTLANE_HIDE_CHANGELOG: 'true'

jobs:
  package:
    runs-on: macos-15
    timeout-minutes: 25
    concurrency:
      group: bash-testflight-package-${{ github.ref }}
      cancel-in-progress: true
    env:
      CERTIFICATE_BASE64: ${{ secrets.BASH_DISTRIBUTION_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.BASH_DISTRIBUTION_P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.BASH_APPSTORE_PROFILE_BASE64 }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/BASH
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Restore stable source timestamps
        run: python3 ci/restore-source-times.py
      - name: Cache release compiled products and packages
        uses: actions/cache@v4
        with:
          path: ios/BASH/DerivedData/release
          key: bash-release-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.1-${{ hashFiles('ios/BASH/project.yml', 'ios/BASH/**/Package.resolved') }}-${{ github.sha }}
          restore-keys: |
            bash-release-v1-${{ runner.os }}-${{ runner.arch }}-xcode-26.1-${{ hashFiles('ios/BASH/project.yml', 'ios/BASH/**/Package.resolved') }}-
      - name: Install signing certificate and profile
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/bash-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/bash.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/bash.mobileprovision"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/bash.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/bash.mobileprovision" > "$RUNNER_TEMP/bash-profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/bash-profile.plist")
          app=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/bash-profile.plist")
          test "$app" = '8GJXSBZAF8.fan.bash.league'
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/bash.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "BASH_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Build signed IPA
        run: BASH_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)) bundle exec fastlane ios package
      - uses: actions/upload-artifact@v4
        with:
          name: bash-ipa
          path: ios/BASH/build/BASH.ipa
          if-no-files-found: error
          retention-days: 3
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bash-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/bash.p12" "$RUNNER_TEMP/bash.mobileprovision" "$RUNNER_TEMP/bash-profile.plist"
          if [ -n "${BASH_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$BASH_PROFILE_UUID.mobileprovision"
          fi

  distribute:
    needs: [package]
    runs-on: macos-15
    timeout-minutes: 30
    # Only upload/processing is serialized. Never interrupt an upload.
    concurrency:
      group: bash-testflight
      cancel-in-progress: false
    env:
      ASC_KEY_ID: ${{ secrets.BASH_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.BASH_ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.BASH_ASC_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4
      - name: Skip superseded push
        id: current
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          head=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/heads/$GITHUB_REF_NAME" --jq .object.sha)
          if [ "$GITHUB_EVENT_NAME" = push ] && [ "$head" != "$GITHUB_SHA" ]; then
            echo 'ship=false' >> "$GITHUB_OUTPUT"
            echo 'A newer commit superseded this release.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'ship=true' >> "$GITHUB_OUTPUT"
          fi
      - uses: ruby/setup-ruby@v1
        if: steps.current.outputs.ship == 'true'
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/BASH
      - uses: actions/download-artifact@v4
        if: steps.current.outputs.ship == 'true'
        with:
          name: bash-ipa
          path: ios/BASH/build
      - name: Verify native scorekeeper API is deployed
        if: steps.current.outputs.ship == 'true'
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://www.bayareastreethockey.com/api/bash/scorekeeper/g207/native')
          test "$status" = '401'
      - name: Upload and distribute to TestFlight
        if: steps.current.outputs.ship == 'true'
        run: BASH_BUILD_NUMBER=$((1000 + GITHUB_RUN_NUMBER)) bundle exec fastlane ios distribute
