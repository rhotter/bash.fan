name: BASH TestFlight

on:
  push:
    branches: [main, video]
    paths:
      - 'ios/BASH/**'
      - 'ios/BASHCapture/Sources/**'
      - '.github/workflows/bash-testflight.yml'
  workflow_dispatch:

permissions:
  contents: read

# Serialize across branches so two uploads never reserve the same build number.
concurrency:
  group: bash-testflight
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: macos-15
    timeout-minutes: 90
    defaults:
      run:
        working-directory: ios/BASH
    env:
      ASC_KEY_ID: ${{ secrets.BASH_ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.BASH_ASC_ISSUER_ID }}
      ASC_KEY_P8_BASE64: ${{ secrets.BASH_ASC_KEY_P8_BASE64 }}
      CERTIFICATE_BASE64: ${{ secrets.BASH_DISTRIBUTION_P12_BASE64 }}
      CERTIFICATE_PASSWORD: ${{ secrets.BASH_DISTRIBUTION_P12_PASSWORD }}
      PROFILE_BASE64: ${{ secrets.BASH_APPSTORE_PROFILE_BASE64 }}
      FASTLANE_SKIP_UPDATE_CHECK: 'true'
      FASTLANE_HIDE_CHANGELOG: 'true'
    steps:
      - uses: actions/checkout@v4
      - name: Check signing credentials
        run: |
          missing=0
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8_BASE64 CERTIFICATE_BASE64 CERTIFICATE_PASSWORD PROFILE_BASE64; do
            if [ -z "${!name}" ]; then
              echo "::error::Missing $name. See ios/BASH/ci/README.md for the corresponding repository secret."
              missing=1
            fi
          done
          exit "$missing"
      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.1'
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'
          bundler-cache: true
          working-directory: ios/BASH
      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/org.swift.swiftpm
            ~/Library/Developer/Xcode/DerivedData/BASH-*/SourcePackages
          key: bash-spm-${{ runner.os }}-${{ runner.arch }}-xcode-26.1-${{ hashFiles('ios/BASH/project.yml') }}
      - name: Run unit tests
        timeout-minutes: 20
        run: |
          set -o pipefail
          device=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; devices=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime,ds in devices.items() if "iOS-18-5" in runtime for d in ds if d["name"].startswith("iPhone")))')
          xcrun simctl boot "$device"
          args=(-project BASH.xcodeproj -scheme BASH -destination "platform=iOS Simulator,id=$device" -only-testing:BASHTests -parallel-testing-enabled NO)
          # Compile while the simulator starts instead of waiting for it first.
          xcodebuild "${args[@]}" build-for-testing
          xcrun simctl bootstatus "$device" -b
          xcodebuild "${args[@]}" test-without-building
      - name: Install signing certificate and profile
        run: |
          set -euo pipefail
          umask 077
          keychain="$RUNNER_TEMP/bash-signing.keychain-db"
          password=$(openssl rand -hex 24)
          echo "::add-mask::$password"
          printf '%s' "$CERTIFICATE_BASE64" | base64 --decode > "$RUNNER_TEMP/bash.p12"
          printf '%s' "$PROFILE_BASE64" | base64 --decode > "$RUNNER_TEMP/bash.mobileprovision"
          security create-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security import "$RUNNER_TEMP/bash.p12" -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -k "$password" "$keychain"
          security list-keychains -d user -s "$keychain" "$HOME/Library/Keychains/login.keychain-db"
          security cms -D -i "$RUNNER_TEMP/bash.mobileprovision" > "$RUNNER_TEMP/bash-profile.plist"
          uuid=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$RUNNER_TEMP/bash-profile.plist")
          app=$(/usr/libexec/PlistBuddy -c 'Print Entitlements:application-identifier' "$RUNNER_TEMP/bash-profile.plist")
          test "$app" = '8GJXSBZAF8.fan.bash.league'
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/bash.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$uuid.mobileprovision"
          echo "BASH_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
      - name: Verify native scorekeeper API is deployed
        run: |
          status=$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' 'https://www.bayareastreethockey.com/api/bash/scorekeeper/g207/native')
          if [ "$status" != '401' ]; then
            echo "::error::Native scorekeeper API must be deployed and require authentication (expected 401, got $status)."
            exit 1
          fi
      - name: Upload and distribute to TestFlight
        run: bundle exec fastlane ios beta
      - name: Remove signing material
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/bash-signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/bash.p12" "$RUNNER_TEMP/bash.mobileprovision" "$RUNNER_TEMP/bash-profile.plist"
          if [ -n "${BASH_PROFILE_UUID:-}" ]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$BASH_PROFILE_UUID.mobileprovision"
          fi
